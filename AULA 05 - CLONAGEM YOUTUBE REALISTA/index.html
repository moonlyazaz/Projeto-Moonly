<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
</head>
<body>
       <header class="cabecalho">
         <div class="cabecalho-inicio">
            <i class="fa-solid fa-bars"></i>

            <div class="logotipo">
            <i class="fa-brands fa-youtube logotipo-icons"></i>
            <p class="logotiponome">YouTube</p>
            <p class="logotipo-pais">BR</p>
            </div>
          </div>

         <div class="cabecalho-centro">
             <input type="text" name="search" id="search-input">
            <button class="search-button">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>

            <button class="microphone">            
                <i class="fa-solid fa-microphone"></i>
                </button>
         </div>



         <div class="cabecalho-final"></div>
        </header>

    <script src="script.js"></script>

</body>
</html>
